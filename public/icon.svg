<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E2E"/>
      <stop offset="100%" stop-color="#B30000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Outer Red Accent Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#redGrad)" stroke-width="12" stroke-dasharray="8 6"/>

  <!-- Sleek Car Silhouette -->
  <g transform="translate(66, 110)">
    <!-- Car Body -->
    <path d="M70,180 C85,150 120,105 170,95 L225,95 C275,95 305,145 320,180 L350,185 C365,190 375,205 375,220 L375,245 C375,255 365,260 350,260 L330,260 C325,235 300,215 270,215 C240,215 215,235 210,260 L160,260 C155,235 130,215 100,215 C70,215 45,235 40,260 L20,260 C10,260 0,250 0,235 L5,205 C10,195 25,185 45,185 Z" fill="url(#redGrad)"/>

    <!-- Roof / Window Glass -->
    <path d="M95,175 C105,150 130,115 170,107 L220,107 C255,107 275,145 285,175 Z" fill="#0F172A"/>
    <path d="M185,115 L185,170 L270,170 C262,148 245,120 220,115 Z" fill="#38BDF8" opacity="0.85"/>
    <path d="M108,170 L175,170 L175,115 C145,120 125,145 108,170 Z" fill="#38BDF8" opacity="0.6"/>

    <!-- Headlight Beam -->
    <polygon points="360,210 375,215 365,225" fill="#FEF08A"/>

    <!-- Front & Rear Wheels -->
    <circle cx="100" cy="255" r="32" fill="#020617" stroke="#475569" stroke-width="8"/>
    <circle cx="100" cy="255" r="14" fill="url(#goldGrad)"/>
    <circle cx="270" cy="255" r="32" fill="#020617" stroke="#475569" stroke-width="8"/>
    <circle cx="270" cy="255" r="14" fill="url(#goldGrad)"/>
  </g>

  <!-- Dealership Branding Text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    NEW SAI CAR BAZAR
  </text>
  <text x="256" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#EF4444" text-anchor="middle" letter-spacing="6">
    BARABANKI
  </text>
</svg>
